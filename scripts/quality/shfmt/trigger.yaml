tool: shfmt
version: "3.8.0"
language: shell
language_version: "bash 5.2"
technique: "Style/Formatting Analysis"
classification: "Shell Formatting Validation"
target_files: [shfmtFixture.sh]
run:
  command: "bash run_shfmt.sh"
expects:
